/* ---------- loop ---------- */
let last = 0, acc = 0, accN = 0, autoScale = true; const headEl = document.getElementById('head'); let headT = 0;

}
function nextTime(dur) { presetDur = typeof dur === 'number' ? dur : 2.2; presetFrom = cur; presetI = (presetI + 1) % PRESETS.length; presetT = 0; document.getElementById('tname').textContent = PRESETS[presetI].name; document.getElementById('bTime').textContent = ['☀', '☼', '◐', '☾'][presetI]; }

/* ---------- boot ---------- */
const goBtn = document.getElementById('go'), tip = document.getElementById('tip');

  P = { terrain: program(TERRAIN_VS, TERRAIN_FS), obj: program(OBJ_VS, OBJ_FS), fol: program(OBJ_VS, OBJ_FS, ['FOL', 'LEAFGAIN 1.5']), grass: program(OBJ_VS, OBJ_FS, ['FOL', 'GRASS', GF, 'LEAFGAIN 1.35']),
